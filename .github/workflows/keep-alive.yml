name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */6 * *'  # 6일마다 자정(UTC) 실행
  workflow_dispatch:        # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rsvp?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status code: $STATUS"
            exit 1
          fi
